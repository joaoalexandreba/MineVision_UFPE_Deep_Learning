[project]
name = "trabalhofinal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.0",
    "matplotlib>=3.11.1",
    "numpy>=2.3.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "roboflow>=1.3.13",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "ultralytics>=8.4.133",
